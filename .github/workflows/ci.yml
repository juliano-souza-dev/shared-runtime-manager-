name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Validate npm build launcher
        run: node --check scripts/compilar.mjs
      - name: Format sources
        run: cargo fmt --all
      - name: Check CLI and library
        run: cargo check --all-targets
      - name: Test CLI and library
        run: cargo test --all-targets
      - name: Check desktop application
        if: matrix.os == 'windows-latest'
        run: cargo check --features desktop --bin srm-gui
