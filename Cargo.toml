[package]
name = "shared-runtime-manager"
version = "0.2.0"
edition = "2021"
description = "Shared dependency and runtime manager for JulianoDev desktop applications"
license = "MIT"

[[bin]]
name = "srm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
