[package]
name = "shared-runtime-manager"
version = "0.5.0"
edition = "2021"
description = "Shared dependency, runtime, and API configuration manager for JulianoDev desktop applications"
license = "MIT"
build = "build.rs"

[[bin]]
name = "srm"
path = "src/main.rs"

[[bin]]
name = "srm-gui"
path = "src/gui.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[build-dependencies]
tauri-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
